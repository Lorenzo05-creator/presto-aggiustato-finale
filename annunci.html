<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pagina degli Annunci</title>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&family=Lato:wght@100;300;400;700;900&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Stile personalizzato -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="annunci-bg w-100">

    <!-- Navbar -->
    <nav id="navbar" class="navbar navbar-expand-lg bg-black fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img id="logo-navbar" src="./media/logo-yellow.png" alt="logo" class="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse bg-black" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="./annunci.html">Annunci</a></li>
                    <li class="nav-item"><a class="nav-link" href="./aboutUs.html">Chi siamo</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Titolo -->
    <h1 class="my-5 p-5 text-center">Pagina degli Annunci</h1>

    <!-- Contenuto Principale -->
    <div class="container vh-100">
        <div class="row w-100">

            <!-- Sidebar con Filtri -->
            <div class="col-12 col-md-3">
                <div class="accordion" id="accordionExample">

                    <!-- Filtro Categoria -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                                Categoria
                            </button>
                        </h2>
                        <div id="collapseOne" class="accordion-collapse collapse show" data-bs-parent="#accordionExample">
                            <div id="radioWrapper" class="accordion-body">
                                <!-- Qui verranno aggiunti i radio button dinamicamente -->
                            </div>
                        </div>
                    </div>

                    <!-- Filtro Prezzo -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                                Prezzo
                            </button>
                        </h2>
                        <div id="collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <input type="number" class="form-control mb-2" placeholder="Min" aria-label="Min Price">
                                <input type="number" class="form-control" placeholder="Max" aria-label="Max Price">
                            </div>
                        </div>
                    </div>

                    <!-- Filtro Parola Chiave -->
                    <div class="accordion-item">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseThree" aria-expanded="false" aria-controls="collapseThree">
                                Parola Chiave
                            </button>
                        </h2>
                        <div id="collapseThree" class="accordion-collapse collapse" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <input type="text" class="form-control" placeholder="Cerca..." aria-label="Keyword Search">
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Sezione Annunci -->
            <div class="col-12 col-md-9 justify-content-center ">
                <div id="annunciContainer" class="mt-3 row row-cols-1 row-cols-md-2 g-4"></div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./annunci.js"></script>

</body>
</html>
